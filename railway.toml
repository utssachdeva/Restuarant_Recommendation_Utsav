# Railway service config for the FastAPI backend (repo root).
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Must run via shell so Railway's PORT env var is expanded (bare $PORT is passed literally).
startCommand = "sh -c 'uvicorn src.api:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
